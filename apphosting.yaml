# Firebase App Hosting runtime configuration.
# Secret values live in Google Cloud Secret Manager; this file contains references only.
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: GOOGLE_MAPS_SERVER_API_KEY
    secret: GOOGLE_MAPS_SERVER_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
